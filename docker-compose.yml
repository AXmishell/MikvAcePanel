services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/axmishell/mikvacepanel:latest
    container_name: mikvace-panel
    restart: unless-stopped
    command: ["--config", "/config/panel.yaml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    # Mount the whole /config directory: Docker creates it automatically and
    # /install can persist panel.yaml there. A single-file bind mount of a
    # missing host file would be created as a directory by Docker/1Panel.
    volumes:
      - ./data:/data
      - ./config:/config

  redis:
    image: redis:7-alpine
    container_name: mikvace-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
