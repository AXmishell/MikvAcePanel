services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/axmishell/mikvacepanel:latest
    container_name: mikvace-panel
    restart: unless-stopped
    command: ["--config", "/app/config/panel.yaml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    # Mount the whole /app/config directory: Docker creates it automatically
    # and /install can persist panel.yaml there. A single-file bind mount of a
    # missing host file would be created as a directory by Docker/1Panel.
    # The image uses /app as its working directory, so both paths live under it.
    volumes:
      - ./data:/app/data
      - ./config:/app/config

  redis:
    image: redis:7-alpine
    container_name: mikvace-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  # Optional external log database. Enable with:
  #   docker compose --profile postgres up -d
  # Create ./config/pg_password (mode 0600) and ./config/telemetry.pg.url
  # before the first start; see docs/telemetry-postgres.md.
  postgres:
    image: postgres:16-alpine
    container_name: mikvace-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: mikvace
      POSTGRES_USER: panel
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/pg_password:/run/secrets/pg_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d mikvace"]
      interval: 10s
      timeout: 3s
      retries: 5
