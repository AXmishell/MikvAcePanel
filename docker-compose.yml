services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/axmishell/mikvacepanel:latest
    container_name: mikvace-panel
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PANEL_PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      DATA_DIR: "/data"
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:-http://localhost:8080}"
      SERVE_WEB: "${SERVE_WEB:-true}"
      FRONTEND_URL: "${FRONTEND_URL:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # Leave empty to open the /install wizard on first boot (when SERVE_WEB
      # is true). Set a strong value in .env for unattended installs.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-24}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      REDIS_URL: "${REDIS_URL:-}"
      REDIS_PREFIX: "${REDIS_PREFIX:-mikvace:}"
      REDIS_REQUIRED: "${REDIS_REQUIRED:-false}"
      CERT_ENC_KEY: "${CERT_ENC_KEY:-}"
      # Database backend. SQLite is the default; the remote backends are wired
      # in incrementally and will be enabled in a later release.
      DB_DRIVER: "${DB_DRIVER:-sqlite}"
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_MAX_OPEN: "${DB_MAX_OPEN:-}"
      DB_MAX_IDLE: "${DB_MAX_IDLE:-}"
      DB_CONN_LIFETIME: "${DB_CONN_LIFETIME:-}"
    # Bind-mount the repository-local data directory instead of a named volume.
    # Everything (panel.db, backups, JWT secret, cert.key) stays inside ./data.
    volumes:
      - ./data:/data

  redis:
    image: redis:7-alpine
    container_name: mikvace-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
