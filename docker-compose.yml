services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/axmishell/mikvacepanel:latest
    container_name: mikvace-panel
    restart: unless-stopped
    command: ["--config", "/config/panel.yaml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    # panel.yaml is mounted writable so /install can persist panel.name,
    # panel.public_url and admin.username. It never contains secret values.
    volumes:
      - ./data:/data
      - ./panel.yaml:/config/panel.yaml

  redis:
    image: redis:7-alpine
    container_name: mikvace-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
