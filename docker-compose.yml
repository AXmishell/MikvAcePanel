services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: mikvacepanel/panel:latest
    container_name: mikvace-panel
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PANEL_PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      DATA_DIR: "/data"
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:-http://localhost:8080}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # Leave empty to generate a random password on first boot (printed once
      # in the panel logs). Set a strong value in .env for unattended installs.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      REDIS_URL: "${REDIS_URL:-}"
      REDIS_PREFIX: "${REDIS_PREFIX:-mikvace:}"
      REDIS_REQUIRED: "${REDIS_REQUIRED:-false}"
      CERT_ENC_KEY: "${CERT_ENC_KEY:-}"
    volumes:
      - panel-data:/data

  redis:
    image: redis:7-alpine
    container_name: mikvace-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  panel-data:
  redis-data:
