services:
  node:
    image: ghcr.io/axmishell/mikvacepanel-node:main
    container_name: mikvace-node
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Hysteria is UDP based and port hopping manipulates host firewall rules.
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      PANEL_URL: "${PANEL_URL:?set PANEL_URL to your panel base URL}"
      NODE_TOKEN: "${NODE_TOKEN:?set NODE_TOKEN from the panel}"
      HY2_RUNTIME: "process"
      DATA_DIR: "/data"
    volumes:
      - "${NODE_DATA_DIR:-/var/lib/mikvace}:/data"
