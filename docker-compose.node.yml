services:
  node:
    image: ghcr.io/axmishell/mikvacepanel-node:latest
    container_name: mikvace-node
    restart: unless-stopped
    # Hysteria is UDP based and port hopping manipulates host firewall rules.
    network_mode: host
    cap_add:
      - NET_ADMIN
    command: ["--config", "/config/node.yaml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./node.yaml:/config/node.yaml:ro
      - ./node.token:/config/node.token:ro
      - ./data-node:/data
