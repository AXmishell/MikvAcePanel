# MikvAce Panel configuration.
# Copy to panel.yaml (or config/panel.yaml for docker compose), then run
# /install or set admin.password_file.
# All application settings live here; environment variables are not read.
version: 1

panel:
  name: "MikvAce Panel"
  # Public URL used in subscriptions and node callbacks. /install can update it.
  public_url: "http://localhost:8080"

server:
  # Container listens on all interfaces; the compose file publishes 8080.
  addr: ":8080"
  # Docker: /app/data. Running the binary directly: ./data
  data_dir: "/app/data"
  serve_web: true
  frontend_url: ""
  cors_origins: []
  # Only these proxies may supply X-Forwarded-For / X-Real-IP.
  trusted_proxies: []
  log_level: "info"

admin:
  username: "admin"
  # Secret must be provided by a file, never inline.
  # Leave empty to let /install create the first administrator.
  password_file: ""

session:
  ttl: "24h"

security:
  # Leave empty to auto-generate data_dir/jwt.secret and data_dir/cert.key.
  jwt_secret_file: ""
  cert_key_file: ""

database:
  # setup starts the first-run wizard without opening the database. The wizard
  # saves the SQLite path and restarts the panel once. Use sqlite to skip that
  # step, or setup to choose a different data file.
  driver: "setup"           # setup | sqlite
  path: "/app/data/panel.db"    # sqlite data file
  max_open: 8
  max_idle: 4
  conn_max_lifetime: "1h"

telemetry:
  # Where parsed proxy logs live. "sqlite" (default) keeps hy2_logs and
  # log_batches in the control database above. "postgres" moves only those two
  # tables to an external server; users, nodes, settings and traffic counters
  # stay in SQLite. The /install wizard can fill this section and write the DSN
  # to server.data_dir/telemetry.pg.url.
  driver: "sqlite"          # sqlite | postgres
  # Required for postgres. The DSN is read from a file so it never appears in
  # panel.yaml, logs or backups, e.g.:
  #   postgres://panel:secret@postgres:5432/mikvace?sslmode=disable
  dsn_file: ""
  # Dedicated schema; the panel creates it and its tables on first start.
  # The runtime role needs CREATE on this schema (or pre-create the schema and
  # grant USAGE, CREATE).
  schema: "public"
  max_open: 12
  max_idle: 4
  conn_max_lifetime: "1h"
  # true: refuse to start when PostgreSQL is unreachable.
  # false: fall back to the local SQLite log tables and report the failure in
  # /api/health. Control-plane features always keep working.
  required: false

redis:
  # Optional. The URL is read from this file, e.g. /app/config/redis.url.
  # The /install wizard can write server.data_dir/redis.url instead. When
  # enabled, Redis also provides the shared L2 analysis cache.
  url_file: ""
  prefix: "mikvace:"
  required: false
