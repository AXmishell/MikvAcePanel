name: Docker Images

# Builds the panel and node images and pushes them to GHCR.
#
# Triggers are intentionally independent from tag pushes: `main` produces the
# rolling `main` / `latest` / `sha-<commit>` tags, while versioned images are
# built only after a GitHub Release is published (which is also when the
# release archives are produced by release.yml).
on:
  push:
    branches: [main]
    # Documentation-only changes cannot affect the images; skip the (slow)
    # multi-arch build for them.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mikvacepanel

jobs:
  publish:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: panel
            dockerfile: Dockerfile
            suffix: ''
            title: MikvAcePanel
          - image: node
            dockerfile: Dockerfile.node
            suffix: '-node'
            title: MikvAcePanel Node Agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build values
        id: prep
        run: |
          # GHCR requires a lowercase repository path.
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.namespace }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            # Pre-releases (`v1.2.3-rc.1`) must not move the stable `1.2` tag.
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=short
            # `main` publishes `latest`; a stable (non-pre-release) GitHub
            # Release publishes it as well, so the tag always points at the
            # newest stable build.
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=MikvAcePanel ${{ matrix.image }} image
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.prep.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
            COMMIT=${{ steps.prep.outputs.commit }}
            BUILD_DATE=${{ steps.prep.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ matrix.image }}\` image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
