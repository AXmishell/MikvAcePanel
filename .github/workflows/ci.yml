name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend build
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Server build
        run: go build ./cmd/...
      - name: API-only server build
        run: go build -tags noweb ./cmd/server
