name: Release

# Publishing a GitHub Release is the only thing that starts this workflow.
# Pushing the tag alone stays silent (no run, no red X on the commit), and the
# release is created/published by hand on GitHub, which also creates the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the archives to (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  # The tag comes from the published release; the manual run passes it as input.
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tags must look like v1.2.3 or v1.2.3-rc.1 (got: $TAG)"
            exit 1
          fi

      # Build the tagged commit even for manual runs, so the archives always
      # match the release they are attached to.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      # Manual runs start from a branch ref, so resolve the commit from the
      # checked-out tag rather than trusting github.sha.
      - name: Resolve commit
        id: commit
        run: echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build frontend
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build release archives
        env:
          VERSION: ${{ env.TAG }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: ./scripts/release.sh

      # The release already exists (it is what triggered this run), so only the
      # generated archives are attached. Pre-release state is whatever was
      # chosen when publishing the release.
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release upload "$TAG" dist/* --clobber
          {
            echo "### Released $TAG"
            echo ""
            echo '```'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets when publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
