name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tags must look like v1.2.3 or v1.2.3-rc.1 (got: $tag)"
            exit 1
          fi

      # Reserve the tag as a draft release *before* running any build tooling.
      # If the tag cannot be published the run stops here instead of spending
      # time on the full cross-platform build; on later failures the draft stays
      # behind (invisible to users) and a re-run reuses it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it"
            exit 0
          fi
          args=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build frontend
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/release.sh

      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          pre=false
          if [[ "$TAG" == *-* ]]; then
            pre=true
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --title "$TAG" --draft=false --prerelease="$pre"
          {
            echo "### Released $TAG"
            echo ""
            echo '```'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets when publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  # Reusable workflows are resolved from the same commit as this file, so the
  # tag must be cut after this change lands on the default branch.
  docker:
    name: Build release images
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
